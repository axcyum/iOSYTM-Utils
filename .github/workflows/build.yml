name: Build ivLyricsYTM

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "(Optional) URL of a decrypted YouTube Music IPA to inject the dylib into"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # arm64 macOS runners kept timing out in the queue ("job was not acquired")
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v4
        with:
          path: theos/
          key: theos_xcode_sdk_344ee59

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      # iOS 18+ target: build against the iPhoneOS SDK shipped with the runner's Xcode
      - name: Show Xcode SDK
        run: xcrun --sdk iphoneos --show-sdk-path && xcodebuild -version

      # Optional: Discord Rich Presence needs the official Discord Social SDK, which cannot be
      # redistributed in the repository. Upload it as `discord-sdk.zip` to a release tagged
      # `build-inputs` in this repository to enable it.
      - name: Fetch Discord Social SDK (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdk
          if gh release download build-inputs -R "${{ github.repository }}" --pattern discord-sdk.zip --dir sdk 2>/dev/null; then
            ditto -x -k sdk/discord-sdk.zip sdk/x
            fw="$(find sdk/x -path '*xcframework/ios-arm64/discord_partner_sdk.framework' -not -path '*__MACOSX*' | head -n 1)"
            if [ -n "$fw" ]; then
              echo "DISCORD_SDK=$(cd "$(dirname "$fw")" && pwd)" >> $GITHUB_ENV
              echo "Discord SDK: $fw"
            fi
          else
            echo "No discord-sdk.zip in release build-inputs: building without Discord Rich Presence"
          fi

      - name: Build dylib
        run: |
          cd main
          make clean all DEBUG=0 FINALPACKAGE=1 ${DISCORD_SDK:+DISCORD_SDK="$DISCORD_SDK"}
          mkdir -p ../out
          cp "$(find .theos/obj -name 'ivLyricsYTM.dylib' -not -path '*/arm64/*' | head -n 1)" ../out/ivLyricsYTM.dylib
          file ../out/ivLyricsYTM.dylib
          otool -L ../out/ivLyricsYTM.dylib
          if [ -n "$DISCORD_SDK" ]; then
            # same binary as the framework, renamed so it can be dropped next to the tweak
            cp "$DISCORD_SDK/discord_partner_sdk.framework/discord_partner_sdk" ../out/discord_partner_sdk.dylib
            sdk=../out/discord_partner_sdk.dylib
            # Hosts like LiveContainer have no /usr/lib/swift rpath: point Swift runtime libraries at the OS copy
            for lib in $(otool -L "$sdk" | awk '/@rpath\/libswift/ {print $1}'); do
              install_name_tool -change "$lib" "/usr/lib/swift/${lib#@rpath/}" "$sdk"
            done
            install_name_tool -id @rpath/discord_partner_sdk.dylib "$sdk"
            ldid -S "$sdk"
            otool -L "$sdk"
            if otool -L "$sdk" | grep -q '@rpath/libswift'; then echo "::error::Swift libraries still use @rpath"; exit 1; fi
          fi
          if otool -L ../out/ivLyricsYTM.dylib | grep -q discord_partner_sdk; then echo "::error::dylib must not link the Discord SDK"; exit 1; fi

      - name: Build jailbreak packages
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 JAILBREAK=1 ${DISCORD_SDK:+DISCORD_SDK="$DISCORD_SDK"}
          make clean package DEBUG=0 FINALPACKAGE=1 JAILBREAK=1 ROOTLESS=1 ${DISCORD_SDK:+DISCORD_SDK="$DISCORD_SDK"}
          cp packages/*.deb ../out/

      - name: Inject into IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget "${{ inputs.ipa_url }}" --no-verbose -O ytm.ipa
          extra=""
          [ -f out/discord_partner_sdk.dylib ] && extra="out/discord_partner_sdk.dylib"
          cyan -i ytm.ipa -o out/YouTubeMusic_ivLyrics.ipa -uwsf out/ivLyricsYTM.dylib $extra

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ivLyricsYTM
          path: out/*
